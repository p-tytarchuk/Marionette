      <h4>What it is</h4>

      <h4>What it is</h4>

      <h4>How to use</h4>
      <ol>
        <li>The first start reads all 68 label shards in the background (about a minute); the page shows the progress.</li>

  },
  raw: {
    title: 'Lottie dataset, raw', icon: 'film', href: '/viewer/lottie_raw.html', group: 'viewers',
    blurb: 'Browse the corpus itself: pick a shard and a window of rows. Animation and SVG sets.',
    tag: 'no labels needed',
    manual: `
      <h4>What it is</h4>
      <p>A direct view of the two datasets in <code>../Datasets</code>: LottieAnimation-660K (68 metadata shards) and LottieSVG-10M (100). It needs nothing but the dataset, so it works for any row, labelled or not. It replaces the <code>--raw</code> mode of the server's Qt viewer.</p>
      <h4>How to use</h4>

  strip: {
    title: 'Filmstrip', icon: 'film', href: null, group: 'tools',
    blurb: 'One picture of a clip: evenly spaced frames from a fixed camera, one row per clip.',
    tag: 'for figures',
    manual: `
      <h4>What it is</h4>
      <p>A rendering page that is controlled entirely by the address bar. Each row is one retargeted clip; the tiles are frames from a fixed orthographic camera, all rows at the same scale (a multiple of the character's rest height), so rows can be compared. It is used for the figures in <code>docs/figures</code>.</p>
      <h4>How to use</h4>
      <p>Press <b>Open an example</b> (it picks the first retargeted clip on the server) or build the address yourself:</p>

const DOCS = [
  ['/README.md', 'README', 'project state, what is done, what comes next'],
  ['/docs/pipeline.html', 'Pipeline: where we are', 'map of every branch and step with its status and a manual'],
  ['/docs/DATASET.md', 'Dataset', 'what data exists, its gaps and the target format'],
  ['/docs/RETARGET.md', 'Retargeter', 'method, parameters, metrics, results, limits'],
  ['/docs/EMBED.md', 'Embeddings (history)', 'record of the motion model experiments; the generator itself was removed on 2026-10-28'],
  ['/docs/MOBILE.md', 'Running on a phone (history)', 'ONNX export audit of the removed generator'],
  ['/docs/LOTTIE_PARSE.md', 'Lottie parsing', 'the text to Lottie branch: corpus parser'],
  ['/eval/README.md', 'Evaluation plan', 'how the finished text to Lottie system is tested: shape, motion, humans and a model judge'],
];

const $ = id => document.getElementById(id);
let opener = null;

function card(key, p) {
  const el = document.createElement('div');
  el.className = 'card';
  const open = p.href ? `<a class="btn" href="${p.href}">Open</a>` : `<button class="btn" data-ex="${key}">Open an example</button>`;
  el.innerHTML = `
    <button class="info" data-info="${key}" aria-label="How ${p.title} works" title="How it works (manual)">i</button>
    <div class="top"><div class="ico">${ICONS[p.icon]}</div><div><h3>${p.title}</h3><p>${p.blurb}</p><span class="tag">${p.tag}</span></div></div>
    <div class="actions">${open}<button class="btn alt" data-info="${key}">Manual</button></div>`;
  return el;
}
for (const [k, p] of Object.entries(PAGES)) $(p.group).appendChild(card(k, p));
$('docs').innerHTML = DOCS.map(([h, t, d]) => `<a href="${h}">${t}<span>${d}</span></a>`).join('');

function openManual(key, from) {
  const p = PAGES[key];
  opener = from;
  $('dtitle').textContent = p.title;
  const go = p.href ? `<a class="btn" href="${p.href}">Open ${p.title}</a>` : `<button class="btn" data-ex="${key}">Open an example</button>`;
  $('dbody').innerHTML = p.manual + `<div class="actions">${go}</div>`;
  $('dbody').scrollTop = 0;
  document.body.classList.add('open');
  $('drawer').setAttribute('aria-hidden', 'false');
  $('close').focus();
}
function closeManual() {
  document.body.classList.remove('open');
  $('drawer').setAttribute('aria-hidden', 'true');
  if (opener) opener.focus();
}
document.addEventListener('click', async e => {
  const i = e.target.closest('[data-info]'), x = e.target.closest('[data-ex]');
  if (i) return openManual(i.dataset.info, i);
  if (x) {
    const old = x.textContent;
    x.textContent = 'looking for a clip…';
    try { location.href = await PAGES[x.dataset.ex].example(); } catch (err) { x.textContent = 'failed: ' + err.message; setTimeout(() => x.textContent = old, 2500); }
  }
});
$('veil').addEventListener('click', closeManual);
$('close').addEventListener('click', closeManual);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.body.classList.contains('open')) closeManual();
});

fetch('/api/targets').then(r => r.json()).then(t => {
  $('status').className = 'ok';
  $('status').textContent = `server running · ${t.length} retarget targets`;
}).catch(() => { $('status').className = 'bad'; $('status').textContent = 'server not responding'; });
</script>
</body>
