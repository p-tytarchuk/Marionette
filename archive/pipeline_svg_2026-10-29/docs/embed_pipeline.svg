<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="825" viewBox="0 0 1260 825" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/></marker></defs>
<rect x="0" y="0" width="1260" height="825" fill="#ffffff"/>
<rect x="4" y="4" width="1252" height="817" rx="12" fill="#ffffff" stroke="#d5d9e0"/>
<text x="28" y="38" font-size="20" font-weight="700" fill="#1d2430">Caption and motion embeddings: from clips and captions to training pairs</text>
<text x="28" y="60" font-size="13" fill="#5b6575">Both motion models are trained to land near the frozen CLIP text embedding of the clip's caption. Numbers are held-out results (rigs never seen in training); chance in brackets.</text>
<text x="30" y="92" font-size="12" font-weight="700" letter-spacing="1.5" fill="#7b8494">DATA</text>
<line x1="30" y1="98" x2="280" y2="98" stroke="#d5d9e0"/>
<text x="340" y="92" font-size="12" font-weight="700" letter-spacing="1.5" fill="#7b8494">FEATURES</text>
<line x1="340" y1="98" x2="630" y2="98" stroke="#d5d9e0"/>
<text x="700" y="92" font-size="12" font-weight="700" letter-spacing="1.5" fill="#7b8494">MODELS</text>
<line x1="700" y1="98" x2="990" y2="98" stroke="#d5d9e0"/>
<text x="1050" y="92" font-size="12" font-weight="700" letter-spacing="1.5" fill="#7b8494">OUTPUTS</text>
<line x1="1050" y1="98" x2="1240" y2="98" stroke="#d5d9e0"/>
<rect x="30" y="110" width="250" height="102" rx="9" fill="#e8f0fb" stroke="#4a78b8" stroke-width="1.8"/>
<text x="42" y="132" font-size="14.5" font-weight="700" fill="#1d2430">UniML3D clips</text>
<text x="42" y="151" font-size="12.5" fill="#2b3442">12,638 clips, raw skeleton NPZ</text>
<text x="42" y="168" font-size="12.5" fill="#2b3442">biped, quadruped, insect, bird,</text>
<text x="42" y="185" font-size="12.5" fill="#2b3442">fish, snake, rigid</text>
<rect x="30" y="228" width="250" height="85" rx="9" fill="#e8f0fb" stroke="#4a78b8" stroke-width="1.8"/>
<text x="42" y="250" font-size="14.5" font-weight="700" fill="#1d2430">Template rigs (free)</text>
<text x="42" y="269" font-size="12.5" fill="#2b3442">65 clips: spider 9, fox 13, horse 13,</text>
<text x="42" y="286" font-size="12.5" fill="#2b3442">kaiju 9, snake 7, fish 6, bird 4, dragon 4</text>
<rect x="30" y="329" width="250" height="102" rx="9" fill="#e8f0fb" stroke="#4a78b8" stroke-width="1.8"/>
<text x="42" y="351" font-size="14.5" font-weight="700" fill="#1d2430">Captions</text>
<text x="42" y="370" font-size="12.5" fill="#2b3442">3 styles per clip (dataset, 17,384</text>
<text x="42" y="387" font-size="12.5" fill="#2b3442">distinct); template captions are written</text>
<text x="42" y="404" font-size="12.5" fill="#2b3442">from clip names, not checked</text>
<rect x="30" y="465" width="250" height="85" rx="9" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="42" y="487" font-size="14.5" font-weight="700" fill="#1d2430">Truebones ZOO: not added</text>
<text x="42" y="506" font-size="12.5" fill="#2b3442">paid pack (about $99+), 1,097 clips</text>
<text x="42" y="523" font-size="12.5" fill="#2b3442">on 74 animals; not redistributable</text>
<rect x="30" y="566" width="250" height="85" rx="9" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="42" y="588" font-size="14.5" font-weight="700" fill="#1d2430">Qwen3-VL-2B captions: tried</text>
<text x="42" y="607" font-size="12.5" fill="#2b3442">from stick-figure renders: R@5 8-17%</text>
<text x="42" y="624" font-size="12.5" fill="#2b3442">(chance 8%), so not used</text>
<rect x="340" y="110" width="290" height="136" rx="9" fill="#e3f4f1" stroke="#2f8f83" stroke-width="1.8"/>
<text x="352" y="132" font-size="14.5" font-weight="700" fill="#1d2430">Role features</text>
<text x="352" y="151" font-size="11.5" fill="#5b6575" font-family="ui-monospace,Menlo,monospace">motion_features.py</text>
<text x="352" y="168" font-size="12.5" fill="#2b3442">root velocity, yaw rate, hips height and tilt,</text>
<text x="352" y="185" font-size="12.5" fill="#2b3442">head, knee/elbow and foot/hand of 4 limbs,</text>
<text x="352" y="202" font-size="12.5" fill="#2b3442">all relative to the hips, divided by hips height</text>
<text x="352" y="219" font-size="12.5" fill="#2b3442">6,055 clips (biped and quadruped only)</text>
<rect x="340" y="264" width="290" height="153" rx="9" fill="#e3f4f1" stroke="#2f8f83" stroke-width="1.8"/>
<text x="352" y="286" font-size="14.5" font-weight="700" fill="#1d2430">Joint-set features</text>
<text x="352" y="305" font-size="11.5" fill="#5b6575" font-family="ui-monospace,Menlo,monospace">motion_sem_features.py</text>
<text x="352" y="322" font-size="12.5" fill="#2b3442">each joint is a token: height, distance from</text>
<text x="352" y="339" font-size="12.5" fill="#2b3442">centroid, vertical and horizontal speed over</text>
<text x="352" y="356" font-size="12.5" fill="#2b3442">128 frames, plus rest-pose structure (depth,</text>
<text x="352" y="373" font-size="12.5" fill="#2b3442">leaf, subtree size). No names, no joint order</text>
<text x="352" y="390" font-size="12.5" fill="#2b3442">12,703 clips, any body</text>
<rect x="340" y="435" width="290" height="136" rx="9" fill="#efe8fa" stroke="#7a56b8" stroke-width="1.8"/>
<text x="352" y="457" font-size="14.5" font-weight="700" fill="#1d2430">CLIP ViT-B/32 text encoder</text>
<text x="352" y="476" font-size="11.5" fill="#5b6575" font-family="ui-monospace,Menlo,monospace">embed.py, template_clips.py</text>
<text x="352" y="493" font-size="12.5" fill="#2b3442">frozen; every caption becomes 512 numbers,</text>
<text x="352" y="510" font-size="12.5" fill="#2b3442">centred by a fixed mean, so the shared</text>
<text x="352" y="527" font-size="12.5" fill="#2b3442">"An object ..." wording drops out</text>
<text x="352" y="544" font-size="12.5" fill="#2b3442">17,413 captions</text>
<rect x="700" y="110" width="290" height="153" rx="9" fill="#fdeede" stroke="#d9822b" stroke-width="1.8"/>
<text x="712" y="132" font-size="14.5" font-weight="700" fill="#1d2430">Role model (variational autoencoder)</text>
<text x="712" y="151" font-size="11.5" fill="#5b6575" font-family="ui-monospace,Menlo,monospace">motion_ae.py</text>
<text x="712" y="168" font-size="12.5" fill="#2b3442">transformer encoder gives z (256) and</text>
<text x="712" y="185" font-size="12.5" fill="#2b3442">sem (512); decoder rebuilds the role features</text>
<text x="712" y="202" font-size="12.5" fill="#2b3442">from z. Held-out text to motion: median rank</text>
<text x="712" y="219" font-size="12.5" fill="#2b3442">11 of 555 [278], R@5 36.4%. Poses rebuild well,</text>
<text x="712" y="236" font-size="12.5" fill="#2b3442">root velocity and turning barely</text>
<rect x="700" y="281" width="290" height="170" rx="9" fill="#fdeede" stroke="#d9822b" stroke-width="1.8"/>
<text x="712" y="303" font-size="14.5" font-weight="700" fill="#1d2430">Semantic model (any body)</text>
<text x="712" y="322" font-size="11.5" fill="#5b6575" font-family="ui-monospace,Menlo,monospace">motion_sem.py</text>
<text x="712" y="339" font-size="12.5" fill="#2b3442">small conv per joint, then a transformer over</text>
<text x="712" y="356" font-size="12.5" fill="#2b3442">the SET of joints and a whole-body token (2.6M</text>
<text x="712" y="373" font-size="12.5" fill="#2b3442">parameters) gives sem (512). Bodies sampled</text>
<text x="712" y="390" font-size="12.5" fill="#2b3442">evenly. Held-out: median rank 36 of 1,262</text>
<text x="712" y="407" font-size="12.5" fill="#2b3442">[631], R@5 18.5%. A body never seen transfers</text>
<text x="712" y="424" font-size="12.5" fill="#2b3442">only weakly</text>
<rect x="1050" y="110" width="190" height="136" rx="9" fill="#e6f5e9" stroke="#3a9a54" stroke-width="1.8"/>
<text x="1062" y="132" font-size="14.5" font-weight="700" fill="#1d2430">motion.npz</text>
<text x="1062" y="151" font-size="12.5" fill="#2b3442">6,055 clips: caption,</text>
<text x="1062" y="168" font-size="12.5" fill="#2b3442">CLIP text embedding,</text>
<text x="1062" y="185" font-size="12.5" fill="#2b3442">z (256), sem (512)</text>
<text x="1062" y="202" font-size="12.5" fill="#2b3442">-&gt; train your diffusion</text>
<text x="1062" y="219" font-size="12.5" fill="#2b3442">model (prompt to z)</text>
<rect x="1050" y="262" width="190" height="102" rx="9" fill="#e6f5e9" stroke="#3a9a54" stroke-width="1.8"/>
<text x="1062" y="284" font-size="14.5" font-weight="700" fill="#1d2430">Onto a character</text>
<text x="1062" y="303" font-size="12.5" fill="#2b3442">decode z -&gt; IK on a human</text>
<text x="1062" y="320" font-size="12.5" fill="#2b3442">rig -&gt; retarget.py onto any</text>
<text x="1062" y="337" font-size="12.5" fill="#2b3442">biped or quadruped</text>
<rect x="1050" y="380" width="190" height="102" rx="9" fill="#e6f5e9" stroke="#3a9a54" stroke-width="1.8"/>
<text x="1062" y="402" font-size="14.5" font-weight="700" fill="#1d2430">motion_sem.npz</text>
<text x="1062" y="421" font-size="12.5" fill="#2b3442">12,703 clips: sem (512)</text>
<text x="1062" y="438" font-size="12.5" fill="#2b3442">-&gt; find motions by text,</text>
<text x="1062" y="455" font-size="12.5" fill="#2b3442">same word on 2, 4, 8 legs</text>
<rect x="1050" y="498" width="190" height="119" rx="9" fill="#e6f5e9" stroke="#3a9a54" stroke-width="1.8"/>
<text x="1062" y="520" font-size="14.5" font-weight="700" fill="#1d2430">Diffusion test (quick)</text>
<text x="1062" y="539" font-size="12.5" fill="#2b3442">prompt -&gt; z, held-out:</text>
<text x="1062" y="556" font-size="12.5" fill="#2b3442">R@5 33.5% (direct 36.4%).</text>
<text x="1062" y="573" font-size="12.5" fill="#2b3442">Speed-aware sampling: bad</text>
<text x="1062" y="590" font-size="12.5" fill="#2b3442">walks 22% -&gt; 10% (real 7%)</text>
<path d="M 280,140 L 340,140" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>
<path d="M 280,180 L 310,180 L 310,300" fill="none" stroke="#4b5563" stroke-width="1.8"/>
<path d="M 280,270 L 310,270" fill="none" stroke="#4b5563" stroke-width="1.8"/>
<path d="M 310,300 L 340,300" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>
<path d="M 280,380 L 320,380 L 320,469 L 340,469" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>
<path d="M 630,160 L 700,160" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>
<path d="M 630,340 L 700,340" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>
<path d="M 630,503 L 668,503 L 668,354" fill="none" stroke="#4b5563" stroke-width="1.8"/>
<path d="M 668,326 L 668,240" fill="none" stroke="#4b5563" stroke-width="1.8"/>
<path d="M 668,240 L 700,240" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>
<path d="M 668,391 L 700,391" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>
<circle cx="668" cy="391" r="3" fill="#4b5563"/>
<text x="636" y="587" font-size="11.5" fill="#6a3fb0" font-style="italic">InfoNCE: each motion is pulled</text>
<text x="636" y="602" font-size="11.5" fill="#6a3fb0" font-style="italic">toward its caption (both models)</text>
<path d="M 990,150 L 1050,150" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>
<path d="M 990,253 L 1020,253 L 1020,313 L 1050,313" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>
<path d="M 990,431 L 1050,431" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="30" y1="669" x2="1230" y2="669" stroke="#d5d9e0"/>
<rect x="30" y="681" width="22" height="14" rx="3" fill="#e8f0fb" stroke="#4a78b8" stroke-width="1.6"/>
<text x="59" y="693" font-size="12" fill="#2b3442">data</text>
<rect x="119" y="681" width="22" height="14" rx="3" fill="#e3f4f1" stroke="#2f8f83" stroke-width="1.6"/>
<text x="148" y="693" font-size="12" fill="#2b3442">features</text>
<rect x="240" y="681" width="22" height="14" rx="3" fill="#efe8fa" stroke="#7a56b8" stroke-width="1.6"/>
<text x="269" y="693" font-size="12" fill="#2b3442">frozen pretrained model</text>
<rect x="481" y="681" width="22" height="14" rx="3" fill="#fdeede" stroke="#d9822b" stroke-width="1.6"/>
<text x="510" y="693" font-size="12" fill="#2b3442">trained here</text>
<rect x="634" y="681" width="22" height="14" rx="3" fill="#e6f5e9" stroke="#3a9a54" stroke-width="1.6"/>
<text x="663" y="693" font-size="12" fill="#2b3442">saved output</text>
<rect x="787" y="681" width="22" height="14" rx="3" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="4 3"/>
<text x="816" y="693" font-size="12" fill="#2b3442">not built / not used</text>
<text x="30" y="721" font-size="12" fill="#4b5563">Why two models: the semantic model reads any skeleton, but its output cannot be turned back into motion. The role model can be decoded and put on a character (IK + retargeter;</text>
<text x="30" y="739" font-size="12" fill="#4b5563">79% of limb movement kept), but only for bipeds and quadrupeds (it needs labelled hips, head, legs, arms).</text>
<text x="30" y="757" font-size="12" fill="#4b5563">Transfer to a body never seen: without insects in training the model finds held-out insect motions at about chance (median rank 11 of 26 [13]; with insects: 3). Without the</text>
<text x="30" y="775" font-size="12" fill="#4b5563">spider it finds common actions among the spider's own 9 clips (walk, jump, attack, idle) but rarer ones not, and among all insect-type clips only weakly (median rank 55 of 165</text>
<text x="30" y="793" font-size="12" fill="#4b5563">[82]). Each body type needs example clips.</text>
</svg>
