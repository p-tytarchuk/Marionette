name: Mario
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # scripts/ (filter_dedupe.py, normalize.py use numpy only; the rest is for analysis and training data prep)
  - numpy
  - scipy
  - pandas
  - pyyaml
  - tqdm
  - pillow
  - matplotlib
  - jupyterlab
  - ipykernel
  # 3D / GLB / skeletons
  - trimesh
  - networkx
  - pygltflib
  # torch from conda-forge on purpose: the pip wheel ships its own libomp and aborts next to conda's
  # ("OMP: Error #15") as soon as it is imported
  - pytorch
  - torchvision
  - pip:
      # VLM tooling for ../Models (Qwen3-VL-2B and 8B; vlm_tables.py, filter_side_view_animals.py) and for the UniMate text encoder (flan-t5, sentencepiece)
      - transformers>=4.57
      - accelerate
      - safetensors
      - huggingface_hub
      - sentencepiece
      - einops
      - timm
      - qwen-vl-utils
      - triangle           # scripts/lottie2d/build_mesh.py and svg_to_mesh.py (constrained Delaunay); installed in the Mario env on 2026-10-27
      - opencv-python-headless   # vlm_tables.py
